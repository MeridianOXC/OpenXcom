  STR_COUNTRY_IS_UNHAPPY_WITH_YOUR_ABILITY: "Financující země {0} vyjadřuje nespokojenost s vaší schopností čelit cizácké aktivitě na svém území a oznamuje snížení svého finančního příspěvku."
  STR_COUNTRIES_ARE_UNHAPPY_WITH_YOUR_ABILITY: "Financující země {0} vyjadřují nespokojenost s vaší schopností čelit cizácké aktivitě na svých územích a oznamují snížení svých finančních příspěvků."
