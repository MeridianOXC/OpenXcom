  STR_COUNCIL_IS_GENERALLY_SATISFIED: "Rada členských států je celkem spokojena s vaším pokrokem."
  STR_COUNCIL_IS_VERY_PLEASED: "Rada členských států je velmi potěšena vaším výborným dosavadním pokrokem. Pokračujte v kvalitní práci."
  STR_COUNCIL_IS_DISSATISFIED: "Rada členských států je nespokojena s vaším výkonem. Pokud nezvýšíte efektivitu v boji s cizáckou hrozbou, bude projekt X-Com ukončen."
  STR_YOU_HAVE_NOT_SUCCEEDED: "Neuspěl jste v boji s cizáckou invazí a rada členských států se neodvolatelně rozhodla ukončit projekt X-Com. Každý stát se vypořádá s problémem dle svého mínění. Můžeme pouze doufat, že s těmito zjevně nepřátelskými silami nalezneme nějaký modus vivendi a že obyvatelstvo přistoupí na podmínky cizáckých návštěvníků."
  STR_COUNTRY_IS_PARTICULARLY_PLEASED: "Financující země {0} vyjadřuje mimořádnou spokojenost s vaší schopností vypořádat se s místní hrozbou a souhlasí se zvýšením svého finančního příspěvku."
  STR_COUNTRIES_ARE_PARTICULARLY_HAPPY: "Financující země {0} vyjadřují mimořádnou spokojenost s vaším postupem při potlačování místního cizáckého vpádu a souhlasí se zvýšením svých finančních příspěvků."
  STR_COUNTRIES_COMMA: "{0}, {1}"
