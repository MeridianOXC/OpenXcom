cs:
  STR_AVENGER_UFOPEDIA: "TRANSPORTNÍ A BITEVNÍ KOSMICKÁ LOĎ. DOKONALÉ NAPODOBENÍ CIZÁCKÉ TECHNOLOGIE."
  STR_INTERCEPTOR_UFOPEDIA: "BITEVNÍ LETOUN S DVOJICÍ PULSNĚ-DETONAČNÍCH MOTORŮ A SPECIÁLNĚ STÍNĚNÝMI ELEKTRONICKÝMI SYSTÉMY. NEJLEPŠÍ DOSTUPNÁ POZEMSKÁ TECHNIKA."
  STR_LIGHTNING_UFOPEDIA: "TRANSPORTNÍ A BITEVNÍ LETOUN. HRUBÁ, ALE EFEKTIVNÍ KOPIE CIZÁCKÝCH PROPULSNÍCH SYSTÉMŮ."
  STR_SKYRANGER_UFOPEDIA: "TRANSPORTÉR PĚCHOTY. NEJRYCHLEJŠÍ SVÉHO DRUHU, S MOŽNOSTÍ SVISLÉHO VZLETU A PŘISTÁNÍ."
  STR_FIRESTORM_UFOPEDIA: "BITEVNÍ LETOUN. TATO JEDNOMÍSTNÁ STÍHAČKA NAPODOBUJE KLASICKÝ TVAR CIZÁCKÉHO LÉTAJÍCÍHO TALÍŘE S CENTRÁLNÍ PROPULSNÍ JEDNOTKOU."
  STR_STINGRAY_UFOPEDIA: "POKROČILÁ RAKETA VZDUCH-VZDUCH SE SPECIÁLNĚ STÍNĚNOU ELEKTRONIKOU."
  STR_AVALANCHE_UFOPEDIA: "RAKETA VZDUCH-VZDUCH S NUKLEÁRNÍ HLAVICÍ, ALE MIMOŘÁDNĚ VYSOKOU HMOTNOSTÍ."
  STR_CANNON_UFOPEDIA: "VYSOCE VÝKONNÉ DĚLO STŘÍLEJÍCÍ PRŮBOJNÉ STŘELY SCHOPNÉ PRORAZIT 400 MM OCELI."
  STR_FUSION_BALL_UFOPEDIA: "TOTO ODPALOVACÍ ZAŘÍZENÍ STŘÍLÍ KULOVITÉ STŘELY HNANÉ REAKCÍ ANTIHMOTY. KOULE NIČÍ CÍL IMPLOZÍ ZPŮSOBENOU GRAVITAČNÍMI VLNAMI."
  STR_LASER_CANNON_UFOPEDIA: "TENTO KONVENČNÍ LASEROVÝ PAPRSEK JE NAPÁJEN REAKČNÍ KOMOROU ANTIHMOTY."
  STR_PLASMA_BEAM_UFOPEDIA: "GRAVITAČNÍ SVAZEK SMĚRUJE PŘESNĚ ZAOSTŘENÉ IMPLODUJÍCÍ GRAVITAČNÍ POLE."
  STR_SECTOID_UFOPEDIA: "Hierarchie sektanů sahá od vojáků až po vůdce s mocnými psionickými schopnostmi. Tyto psionické síly mohou být použity k demoralizaci vojáků v boji nebo dokonce k ovládnutí jejich myslí. Jsou zapleteni do únosů lidí a mrzačení skotu. Únosy jsou používány pro získání genetického materiálu pro křížení a vývoj klonů vhodných k infiltraci lidské společnosti. Dobytek poskytuje jednak potravu, jednak genetický materiál. Zdá se, že tato rasa chce vyvinout vysoce kvalitní genetické hybridy vhodné pro zvýšení efektivity jejich společnosti, která se strukturou podobá roji."
  STR_SECTOID_AUTOPSY: "Pitva sektana"
  STR_SECTOID_AUTOPSY_UFOPEDIA: "Pitva odhalila zakrnělé trávicí orgány a jednoduché ústrojí. Mozek a oči jsou velmi dobře vyvinuty. Stavba těla naznačuje genetickou úpravu nebo mutaci. Malá ústa a nos mají zřejmě jen malou funkci. Blány mezi prsty a plochá chodidla naznačují vodní původ. Tělo neobsahuje žádné rozmnožovací orgány a nic nenapovídá, jak se tento druh rozmnožuje. S největší pravděpodobností jde o geneticky upravený druh."
  STR_SNAKEMAN_UFOPEDIA: "Tato rasa se vyvinula v extrémně nepříznivém prostředí. Hadomové jsou neobyčejně odolní a snášejí extrémní výkyvy teplot. Pohybují se pomocí obrovské 'nohy' podobné hadovi, která chrání všechny jejich životně důležité orgány. Jejich cíle se zdají být čistě predátorské a zřejmě podléhají velení jiné inteligence, která řídí jejich vojensky vedené vpády na Zemi."
  STR_SNAKEMAN_AUTOPSY: "Pitva hadoma"
  STR_SNAKEMAN_AUTOPSY_UFOPEDIA: "Kůže je extrémně tuhá a odolná proti žáru. Kardiovaskulární systém je součástí pohybového ústrojí, které k pohybu využívá hydraulický princip. Jediným skutečným svalem je 'srdce'. Rozmnožovací soustava se zdá být velmi účinná. Rozmnožování je bezpohlavní; každý Hadom nosí ve svém těle najednou až padesát vajíček. Bez kontroly by tento druh představoval vážnou hrozbu pro život na Zemi."
  STR_ETHEREAL_UFOPEDIA: "Tato bytost disponuje ohromnými mentálními schopnostmi, které umožňují telepatickou komunikaci a telekinezi. Zdánlivě slabé fyzické schopnosti tohoto tvora jsou udržovány jeho mentálními silami. Nevíme, jak tyto telekinetické síly fungují, protože se zdá, že odporují fyzikálním zákonům, jak je známe. Etheralové jsou mimořádně nebezpeční v každé bojové situaci, v níž spoléhají na své mentální schopnosti. Na Zemi se objevují zřídka, protože se při plnění svých cílů zřejmě spoléhají na jiné rasy."
  STR_ETHEREAL_AUTOPSY: "Pitva etherala"
  STR_ETHEREAL_AUTOPSY_UFOPEDIA: "Tato bytost je fyzicky nevyvinutá a zdá se neschopná udržovat jakékoli životní funkce. Svaly jsou těžce atrofované a vnitřní orgány nedostatečně vyvinuté. Smyslové orgány včetně očí zřejmě vůbec nefungují. Mozek je však dobře vyvinutý a spotřebovává značnou část krve v těle. Je záhadou, jak se tento tvor dokáže udržet při životě bez vnější podpory."
  STR_MUTON_UFOPEDIA: "Tento humanoidní tvor je fyzicky silný a inteligentní. Mutoni mají zvláštní chuť na syrové maso všeho druhu, které stejně jako pozemští masožravci potřebují k obživě. Zjevně jsou závislí na telepatických povelech rasy známé jako 'Etheralové'. Po přerušení tohoto telepatického spojení se jejich mentální systém zřejmě rozpadne a umírají. Kybernetické implantáty zvyšují jejich bojovou výkonnost. Jde zjevně o pěšáky ve službách vyšší inteligence."
  STR_MUTON_AUTOPSY: "Pitva mutona"
  STR_MUTON_AUTOPSY_UFOPEDIA: "'Kůže' tohoto tvora je zřejmě organicky vytvořená ochranná zbroj naroubovaná na tělo. Tělo obsahuje četné kybernetické implantáty, které posilují kardiovaskulární soustavu a smysly. Rozmnožovací orgány byly zřejmě chirurgicky odstraněny. Tito nešťastní tvorové jsou očividně odsouzeni k životu plnému válčení a dobývání. Průbojná munice není proti jejich zesílené kůži příliš účinná."
  STR_CELATID_UFOPEDIA: "Tato forma života má záhadnou přirozenou schopnost vznášet se ve vzduchu. Zřejmě dokáže zachytit vlny lidského mozku a pohybuje se k lidskému cíli, i když je dobře ukrytý. Jakmile Celatid cíl odhalí, přistane a vystřelí malé kuličky extrémně žíravého jedu. Tento tvor se dokáže klonovat znepokojivou rychlostí. Doprovází rasu Mutonů při jejím putování."
  STR_CELATID_AUTOPSY: "Pitva celatida"
  STR_CELATID_AUTOPSY_UFOPEDIA: "Jádro obsahuje malé biomechanické zařízení, které je zřejmě přirozeně vyvinutým antigravitačním propulsním systémem. Vak s jedem je největším orgánem a samostatná mozková struktura zřejmě neexistuje. Nelze rozpoznat žádnou trávicí ani rozmnožovací soustavu. Malý orgán obsahuje embrya, která mohou rychle vyrůst v nového jedince."
  STR_SILACOID_UFOPEDIA: "Tato forma života, založená na křemíku, generuje enormní množství tepla. Má dost síly k rozdrcení kamenů, jež pak tráví horkým jádrem. Má primitivní inteligenci a může být kontrolována telepatickými bytostmi nebo pomocí implantátů. Doprovází rasu Mutonů."
  STR_SILACOID_AUTOPSY: "Pitva silacoida"
  STR_SILACOID_AUTOPSY_UFOPEDIA: "Jádro tvora je extrémně horké a zdá se být základem trávicí soustavy. Jeho jedinečný svalový aparát má ohromnou sílu a rychlost. Kůže podobná skále není poškozována ohněm ani zápalnou municí."
  STR_CHRYSSALID_UFOPEDIA: "Klepeta tohoto tvora, podobná krabím, jsou mocnou zbraní v boji zblízka. Rychlý metabolismus a síla mu dodávají rychlost a obratnost. Místo aby oběť zabil, vloží do ní vajíčko a vstříkne jí jed, který ji promění v chodící zombii. Krátce poté se z oběti prodere nový Krysklad. Kryskladi jsou spojeni s rasou Hadomů."
  STR_CHRYSSALID_AUTOPSY: "Pitva krysklada"
  STR_CHRYSSALID_AUTOPSY_UFOPEDIA: "Vnější kostra tohoto tvora je extrémně tvrdá, ale překvapivě zranitelná explozivní municí. Mozek je dobře vyvinutý a buňky tohoto tvora rostou velmi rychle. Tvor v sobě nese dvacet vajíček, která klade do jiných organismů. Jde o velmi účinnou zbraň teroru."
  STR_FLOATER_UFOPEDIA: "Leviti jsou především vojáci a původci teroru. Jsou to od přírody dravé šelmy, geneticky upravené a kyberneticky vylepšené tak, aby se z nich stali obávaní válečníci. Spodní polovina těla a většina vnitřních orgánů jsou chirurgicky odstraněny a nahrazeny systémem podpory života. Tento implantát obsahuje antigravitační jednotku, která tvoru umožňuje vznášet se vzduchem, byť nejistě."
  STR_FLOATER_AUTOPSY: "Pitva levita"
  STR_FLOATER_AUTOPSY_UFOPEDIA: "Tvor byl drasticky pozměněn chirurgickým zákrokem. Zařízení, které zřejmě tvoří jádro těla, je systém podpory života přebírající funkce srdce, plic a trávicí soustavy. To tvoru umožňuje přežívat v extrémně nepříznivých prostředích. Mozek je menší než lidský, ale smyslové orgány jsou dobře vyvinuté."
  STR_REAPER_UFOPEDIA: "Tento dvounohý masožravec má silné čelisti a nenasytný apetit. Je vybaven množstvím mozkových implantátů, které slouží k ovládání jeho činnosti. Primitivní lovecké instinkty tohoto tvora nemají jiné využití než terorizování a ničení. Páráci běžně doprovázejí levity."
  STR_REAPER_AUTOPSY: "Pitva páráka"
  STR_REAPER_AUTOPSY_UFOPEDIA: "Párák má dva 'mozky' a dvě 'srdce', což mu umožňuje pokračovat v boji i s velmi těžkým zraněním. Nicméně jeho chlupatá kůže je vysoce vznětlivá, což činí tuto kreaturu zranitelnou zápalnými zbraněmi."
  STR_SECTOPOD_UFOPEDIA: "Sektopodi jsou roboti vybavení výkonnou zbraní s laserovým paprskem. Tyto mechanické nestvůry jsou ovládány telepatickým spojením se svými vládci, Etheraly. Sektopodi jsou nejmocnější zbraní teroru, kterou mají cizácké síly k dispozici."
  STR_SECTOPOD_AUTOPSY: "Pitva sektopoda"
  STR_SECTOPOD_AUTOPSY_UFOPEDIA: "Robot má robustní konstrukci a energeticky poháněnou zbroj schopnou odolat většině druhů útoku, zejména plasmovým zbraním. Jeho senzorové obvody se však zdají být obzvlášť zranitelné vůči laserovým zbraním."
  STR_CYBERDISC_UFOPEDIA: "Tento miniaturní létající talíř je automatizovaná zbraň teroru vyzbrojená výkonným plasmovým paprskem. Antigravitační pohon mu dává velkou výhodu v obtížném terénu. Jeho hlavní funkcí je ničení a teror ve službách rasy sektanů."
  STR_CYBERDISC_AUTOPSY: "Pitva kyberdisku"
  STR_CYBERDISC_AUTOPSY_UFOPEDIA: "Kyberdisk je dobře opancéřovaný a zvlášť odolný proti explozivní munici. Primární antigravitační systém je příliš poškozený na to, aby bylo možné porozumět jeho fungování."
  STR_UFO_POWER_SOURCE_UFOPEDIA: "Zdrojem energie cizáckých lodí je antihmotový reaktor, který používá Elerium (prvek 115) k vytváření silných gravitačních vln a dalších forem energie. Přeměna hmoty na energii má neuvěřitelnou účinnost 99 %, takže i nepatrné množství Eleria může vyprodukovat obrovské množství energie. Tuto jednotku lze snadno reprodukovat za použití cizáckých slitin."
  STR_UFO_NAVIGATION_UFOPEDIA: "Cizácké lodě používají k navigaci na Zemi i ve vesmíru sofistikované počítače. Systém je založen na optických procesorech uspořádaných do sítě. Ovládací rozhraní je poměrně jednoduché - navigátor řídí směr gravitačních vln vytvářených zdrojem energie a tím pohybuje lodí libovolným směrem. Tento systém mohou lidé snadno používat a lze jej reprodukovat za použití cizáckých slitin a dalších součástí."
  STR_UFO_CONSTRUCTION_UFOPEDIA: "Cizácká loď se skládá ze tří hlavních komponent - zdroje energie, navigačního systému a skořepiny z cizáckých slitin. Skořepina je speciálně tvarovaná tak, aby mohly být gravitační vlny usměrňovány a ovládány. Zdroj energie navíc vyžaduje malé množství Eleria jako palivo. Jakmile porozumíme principům konstrukce a funkcím jednotlivých komponent, bude možné tyto typy letounů stavět."
  STR_ALIEN_FOOD_UFOPEDIA: "Tyto nádrže obsahují rozličné enzymy, jež tráví části těl skotu, jiných zvířat a dokonce i lidí. Tekutina je pak konzumována jako už strávené jídlo - pravděpodobně přímo do krevního oběhu. To naznačuje určitou závislost na potravě pozemského původu - symbiózu mezi Zemí a cizáckou společností."
  STR_ALIEN_REPRODUCTION_UFOPEDIA: "Tyto komory obsahují cizácké zárodky. Z konstrukce těchto zásobníků lze usuzovat, že cizáci používající tento proces jsou plně závislí na laboratorním rozmnožování. Výživné látky zajišťují rychlý vývoj zárodku. Tento systém podobný výrobní lince je schopen vytvořit tisíce cizáckých klonů v krátkém časovém úseku. Postup lze snadno přizpůsobit rozmnožování lidí nebo cizácko-lidských hybridů."
  STR_ALIEN_ENTERTAINMENT_UFOPEDIA: "Nejpravděpodobnější funkce těchto koulí je rekreační. Psionické obvody stimulují různá centra mozku. Účinek je podobný působení halucinogenních drog. Je to jediný důkaz, že cizáci provozují nějaké kulturní nebo rekreační aktivity."
  STR_ALIEN_SURGERY_UFOPEDIA: "Toto chirurgické zařízení používá laserové řezačky k získávání určitých částí těl skotu a jiných zvířat. Rozšířené případy mrzačení skotu lze vysvětlit touto bizarní cizáckou činností. Tyto části jsou pravděpodobně používány k výživovým nebo genetickým účelům."
  STR_EXAMINATION_ROOM_UFOPEDIA: "V minulosti mnoho tisíc lidí tvrdilo, že byli uneseni cizáky, někteří i opakovaně. Pravda je mnohem hrůznější. Lidé jsou unášeni, zkoumáni a pozorováni. Z nejlepších exemplářů je odebírán genetický materiál. Ženám jsou implantovány lidsko-cizácké hybridní zárodky, které jsou o několik měsíců později vyjmuty. Kdo ví, jaké zlověstné motivy cizáci mají?"
  STR_ALIEN_ALLOYS_UFOPEDIA: "Cizácké lodě jsou konstruovány ze speciálních slitin s jedinečnými vlastnostmi. Jsou extrémně lehké a odolné a lze je tvarovat elektromagnetickými metodami. Tento materiál lze reprodukovat a používat v mnoha výrobních postupech."
  STR_ELERIUM_115_UFOPEDIA: "Tento prvek má neobyčejnou vlastnost: je-li bombardován určitými částicemi, vytváří energii antihmoty. Ta vytváří gravitační vlny a další formy energie. V naší sluneční soustavě se přirozeně nevyskytuje a nelze jej reprodukovat."
  STR_ALIEN_ORIGINS_UFOPEDIA: "Je zřejmé, že na Zemi bojujeme předem prohranou bitvu. Cizácké hordy nás drtivě přečíslují. To nejlepší, co můžeme udělat, je zpomalit jejich postup. Jedinou nadějí lidstva je zaútočit na cizáky u jejich zdroje. Náš výzkum ukazuje na nedalekou operační základnu v naší sluneční soustavě. Podle cizáků je toto místo centrem pradávné civilizace, která existovala již před počátkem lidských dějin. Musíme toto místo co nejdříve najít. Musíme však zajmout a vyslechnout cizáckého vůdce, abychom získali podrobnější informace. Na palubě větších UFO se pravděpodobně nachází alespoň jeden cizácký vůdce."
  STR_THE_MARTIAN_SOLUTION_UFOPEDIA: "Náš výzkum nyní ukazuje na Mars jako základnu cizáckých operací. Základna je dobře ukrytá a obsahuje všechny výrobní a klonovací kapacity potřebné k podpoře infiltrace Země. Zdá se také, že obsahuje jakýsi řídicí počítač, který ovládá celou operaci. Zdá se, že cizácká společnost podobná roji má jakousi 'včelí královnu'. To je její zásadní slabina - pokud dokážeme zničit 'mozek', zemře i tělo. Musíme zintenzivnit výzkumné úsilí, než bude příliš pozdě. Abychom mohli pokročit, musíme zajmout cizáky s nejvyšší hodností - velitele, kteří se vyskytují pouze v cizáckých základnách a na bitevních lodích."
  STR_CYDONIA_OR_BUST_UFOPEDIA: "Nyní je zřejmé, že hordy cizáků jsou řízeny z podzemní základny v Cydonii - neobvyklé oblasti Marsu s pětibokými pyramidami a rozsáhlým útvarem připomínajícím lidskou tvář. Cydonijská civilizace na Marsu vzkvétala před mnoha miliony let, ale nevíme, proč zanikla ani jak souvisí s nejnovější cizáckou aktivitou v této oblasti. Ať už je vysvětlení jakékoli, musíme do Cydonie vyslat expedici. Je to jediný způsob, jak můžeme cizáky porazit. Musíme zničit hlavní řídicí 'mozek'. Budeme potřebovat loď Mstitel vybavenou tou nejničivější silou, jakou máme k dispozici. Zde už se nic dalšího nedozvíme - musíme počkat na výsledek útoku na Cydonii."
