  STR_ACCESS_LIFT_UFOPEDIA: "Přístupový výtah umožňuje transportovat vybavení a zaměstnance dovnitř či ven z podzemní základny. Je to vždy první zařízení, které je v nové základně postaveno. Oblast výtahu je jedním z přístupových bodů pro cizácký výsadek."
  STR_LIVING_QUARTERS_UFOPEDIA: "Každý obytný blok poskytuje ubytování až pro padesát osob. Kromě míst ke spánku disponuje také vybavením pro volný čas a stravování."
  STR_LABORATORY_UFOPEDIA: "V jedné laboratoři může pracovat až padesát vědců. Laboratoře jsou vybaveny nejmodernějšími technologiemi pro výzkum materiálů, biochemie a kosmologie. Je vám poskytnut privilegovaný přístup do nejlepších výzkumných laboratoří světa, včetně vojenských."
  STR_WORKSHOP_UFOPEDIA: "Dílna obsahuje veškeré zařízení nutné k výrobě vybavení podle plánů vytvořených ve vědeckých laboratořích. V dílně může pracovat až 50 inženýrů. Je nutné počítat s tím, že vyráběné předměty rovněž zabírají nějaké místo."
  STR_SMALL_RADAR_SYSTEM_UFOPEDIA: "Malý detekční systém disponuje radarem s efektivním dosahem 300 námořních mil a je spojen se satelitními systémy pro pozemní vyhledávání. Každých třicet minut má každý systém desetiprocentní šanci detekovat objekt průměrné velikosti."
  STR_LARGE_RADAR_SYSTEM_UFOPEDIA: "Velký detekční systém disponuje radarem s efektivním dosahem 450 námořních mil, který je spojen se satelitními systémy pro pozemní vyhledávání. Každých třicet minut má každý systém dvacetiprocentní šanci detekovat objekt průměrné velikosti."
  STR_MISSILE_DEFENSES_UFOPEDIA: "Raketová obrana poskytuje částečnou ochranu proti nepřátelským plavidlům, která se pokoušejí přistát v blízkosti základny."
  STR_GENERAL_STORES_UFOPEDIA: "Veškeré vybavení, zbraňové systémy, munice, posbíraný materiál a těžká zbraňová technika jsou umístěny ve skladech, včetně vybavení přiřazeného k letounům v hangárech."
  STR_ALIEN_CONTAINMENT_UFOPEDIA: "Aby bylo možné živé cizáky udržet při životě, je potřeba je umístit do speciálního prostředí. V této cele je možné v oddělených kójích zadržovat až 10 cizáckých forem života."
  STR_LASER_DEFENSES_UFOPEDIA: "Laserová obrana poskytuje ochranu před průnikem nepřátelských plavidel."
  STR_PLASMA_DEFENSES_UFOPEDIA: "Plazmová obrana poskytuje výkonnou a efektivní ochranu před průnikem nepřátelských plavidel."
  STR_FUSION_BALL_DEFENSES_UFOPEDIA: "Fúzní střely poskytují nejefektivnější možnou obranu před cizáckými útoky. Tyto střely vytvářejí implozi antihmoty, která ničí vše v dosahu."
  STR_GRAV_SHIELD_UFOPEDIA: "Gravitační štít znesnadňuje přistání cizáckého stroje a následný útok na základnu natolik, že veškeré obranné systémy mohou vystřelit dvakrát."
  STR_MIND_SHIELD_UFOPEDIA: "Protože cizácké lodě při zjišťování lidské přítomnosti spoléhají na mozkové vlny, nejefektivnějším opatřením je odstínit mozkové vlny vycházející ze základny. Toto zařízení výrazně sníží pravděpodobnost, že cizácké lodě základnu odhalí."
  STR_PSIONIC_LABORATORY_UFOPEDIA: "Psionická laboratoř umožňuje odhalit psionické nadání jakéhokoliv vojáka v základně a poskytnout mu nutný výcvik pro využití jeho psionických dovedností. Každá laboratoř může najednou cvičit až 10 vojáků. Výcvik je rozvržen vždy na konci měsíce. Bojové využití psioniky umožňuje zařízení Psi-amp."
  STR_HYPER_WAVE_DECODER_UFOPEDIA: "Cizácká komunikace využívá hyper-dimenzionální vlny, které se šíří prakticky okamžitě. Zařízení dekodéru zachytává vysílání UFO a dekóduje informace. Tak lze odhalit typ UFO, cizáckou rasu a typ aktivity."
  STR_HANGAR_UFOPEDIA: "V každém hangáru může být umístěn jeden stroj. Je v něm také vybavení pro údržbu, tankování a opravy strojů X-Com. Každý stroj umístěný na základně musí mít přidělen vlastní hangár, který nemůže současně využívat jiný stroj, a to ani tehdy, je-li přiřazený stroj právě na misi mimo základnu."
  STR_PISTOL_UFOPEDIA: "Standardní pistole X-Com je vysoce výkonná poloautomatická zbraň se zásobníkem na 12 nábojů."
  STR_RIFLE_UFOPEDIA: "Tato vysoce přesná odstřelovací puška má laserový zaměřovač a zásobník na 20 nábojů ráže 6,7 mm."
  STR_HEAVY_CANNON_UFOPEDIA: "Těžký kanón (TK) je ničivou, avšak těžkopádnou zbraní. Umožňuje střílet třemi typy munice - průbojnou, zápalnou a explozivní."
  STR_AUTO_CANNON_UFOPEDIA: "Gatling (GT) kombinuje všestrannost a sílu těžkého kanónu s rychlejší kadencí."
  STR_ROCKET_LAUNCHER_UFOPEDIA: "Ruční raketomet je laserem naváděný systém, schopný odpalovat tři různé typy raket."
  STR_LASER_PISTOL_UFOPEDIA: "Laserová pistole je efektivní implementací nové technologie. Kombinuje výhody pistole s rychlejší a přesnější střelbou."
  STR_LASER_RIFLE_UFOPEDIA: "Laserová puška je silnější a přesnější verzí předešlého návrhu pistole."
  STR_HEAVY_LASER_UFOPEDIA: "Těžký laser je těžkopádný, ale extrémně efektivní."
  STR_GRENADE_UFOPEDIA: "Tento standardní granát má přesný časovač pro precizní načasování výbuchu."
  STR_SMOKE_GRENADE_UFOPEDIA: "Kouřové granáty jsou vhodné pro krytí v otevřeném terénu. Je třeba ale počítat s tím, že poskytují krytí oběma stranám. "
  STR_PROXIMITY_GRENADE_UFOPEDIA: "Miny mohou být vrženy stejně jako běžný granát, ale po dopadu jsou aktivovány blízkým pohybem. Pro správné použití těchto zařízení je nutný dostatek dovednosti a opatrnosti."
  STR_HIGH_EXPLOSIVE_UFOPEDIA: "Tato výbušnina je určena pro demoliční účely. Obsluha se musí zdržovat v dostatečné vzdálenosti od demolovaných objektů."
  STR_MOTION_SCANNER_UFOPEDIA: "Toto sofistikované zařízení využívá různé detektory a pokročilé počítačové algoritmy k rozpoznání pohybujících se nepřátelských jednotek. K účinnému použití je však třeba trochu cviku. Na taktické obrazovce klikněte na ikonu detektoru pohybu. V nabídce zvolte 'Použít skener'. Na obrazovce detektoru ukazuje šipka uprostřed směr, kterým je voják otočen (sever je nahoře). Blikající body označují jednotky, které se nedávno pohnuly. Velké nebo rychle se pohybující jednotky vytvářejí větší body. Nehybné jednotky nebudou odhaleny."
  STR_MEDI_KIT_UFOPEDIA: "Medkit kombinuje léčebné prostředky s analgetiky a stimulanty. Chcete-li medkit použít, musíte stát čelem k ošetřovanému vojákovi. Je-li voják omráčen, musíte stát nad jeho tělem. Klikněte na ikonu medkitu a v nabídce zvolte 'Použít Medkit'.{NEWLINE}UZDRAVIT> Červeně vyznačené části těla označují smrtelná zranění. Klikněte na zraněnou část těla. Klikněte na tlačítko 'UZDRAVIT'. Tím se vyléčí jedno smrtelné zranění a obnoví část zdraví.{NEWLINE}STIMULOVAT> Obnoví energii a probere omráčené vojáky z bezvědomí. Chcete-li probrat vojáka z bezvědomí, musíte stát přímo nad jeho tělem.{NEWLINE}UTIŠIT> Obnoví morálku zraněného vojáka nejvýše o hodnotu odpovídající ztracenému zdraví."
  STR_PSI_AMP_UFOPEDIA: "Psi-amp mohou používat pouze vojáci s psionickými schopnostmi. Během boje klikněte na Psi-amp, vyberte typ útoku a kurzorem označte cílovou jednotku. K dispozici jsou dva typy psionického útoku:{NEWLINE}ZPANIKAŘIT JEDNOTKU> Při úspěšném útoku klesne morálka cíle a cíl může zpanikařit.{NEWLINE}OVLÁDNUTÍ MYSLI> Při úspěchu okamžitě získáte kontrolu nad nepřátelskou jednotkou, jako by byla vaše vlastní. U tohoto typu útoku je obtížnější uspět."
  STR_STUN_ROD_UFOPEDIA: "Toto zařízení lze použít pouze v boji zblízka; elektrickými výboji ochromí živý organismus, aniž by jej zabilo."
  STR_MIND_PROBE_UFOPEDIA: "Čtečka mysli je cizácké komunikační zařízení, které získává informace přímo z mozkových vln. Jednotky X-Com ji mohou v boji použít k zobrazení vlastností cizáka. Klikněte na čtečku mysli a poté na volbu 'Použít čtečku mysli'. Pak kurzorem klikněte na cizáka."
  STR_PLASMA_PISTOL_UFOPEDIA: "Plazmové pistole jsou smrtící cizácké zbraně založené na urychlování částic v nepatrném antigravitačním poli."
  STR_PLASMA_RIFLE_UFOPEDIA: "Tato zkázonosná zbraň je založena na částicích urychlovaných v nepatrném antigravitačním poli."
  STR_HEAVY_PLASMA_UFOPEDIA: "Tato ničivá zbraň je založena na urychlování částic v nepatrném antigravitačním poli."
  STR_BLASTER_LAUNCHER_UFOPEDIA: "Jde o odpalovač cizáckých naváděných střel, střílející výkonné \"ďábelské bomby\". Vystřelíte-li z této zbraně, budete moci určit body trajektorie střely. Po naplánování trajektorie klikněte na speciální odpalovací ikonu."
  STR_SMALL_LAUNCHER_UFOPEDIA: "Malý odpalovač střílí ochromující bomby. Je velmi užitečný pro zajímání živých cizáků."
  STR_ALIEN_GRENADE_UFOPEDIA: "Toto zařízení funguje stejně jako pozemský granát - pouze je výkonnější."
