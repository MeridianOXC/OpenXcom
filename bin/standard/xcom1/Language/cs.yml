  STR_COST: "Cena"
  STR_VICTORY_1: "Jakmile vstoupíte do velké místnosti, uvidíte cizácký mozek – cíl výpravy. Než stačíte vypálit, začne s vámi komunikovat prostřednictvím obrazovky na svém podstavci. Naléhavě vás žádá, abyste si vyslechli jeho argumenty pro přežití, ještě než se rozhodnete stisknout spoušť..."
  STR_VICTORY_2: "Mozek promlouvá: 'Před mnoha miliony let byla planeta, jež nazýváte Marsem, živá. Tento život byl na pustou planetu přinesen naší civilizací a stejně tak byl přinesen i na vaši planetu. Po miliony let navštěvujeme vaši planetu a geneticky rozvíjíme váš druh. Nemůžete nás zabít, jste naší součástí..."
  STR_VICTORY_3: "Zde je centrum marťanské civilizace - pyramidy postavené miliony let před těmi pozemskými - druhem, jenž je vaším předkem. Žádná planeta nám není nedosažitelná. Tato moc může být zanedlouho i vaše. Vše, co žádáme na oplátku, je vaše spolupráce..."
  STR_GAME_OVER_1: "Cizáci se pokoušejí zlikvidovat veškeré lidstvo; ničí města a otravují vzduch a moře. Odpor pozemských armád je marný tváří v tvář mnohem dokonalejším technologiím. Přeživší generace při útěku před cizáckým ničením trpí hroznými mutacemi. Jsou nahnány do otrockých táborů, aby pomohly přeměnit Zemi v cizáckou kolonii, která je součástí jakéhosi neznámého impéria."
  STR_GAME_OVER_2: "Znalosti získané projektem X-Com jsou navždy ztraceny. Nepodařilo se vám zachránit Zemi."
  STR_VICTORY_4: "Řeč cizáckého mozku přeruší výboj horké plasmy. Veškeré cizácké síly jsou poraženy."
  STR_VICTORY_5: "Ztrátou Marsu ztratili cizáci i Zemi. Výzkumy X-Com umožnily lidstvu znovu vzkvést a získat Mars pro sebe. Cizácký přízrak zmizel, ale kdo ví, na jak dlouho..."
  STR_YOU_HAVE_FAILED: "Nepodařilo se vám zastavit mimozemský nápor. Členské státy rady jeden po druhém podepsaly s cizáky dohody slibující prosperitu, technologie a mír. Avšak brzy se ukázalo, že cizáci mají jiné plány..."
