  STR_CRAFT_DEPLOYMENT_PREVIEW_SAVED: "Náhled *"
  STR_CRAFT_DEPLOYMENT_PREVIEW_BRIEFING: "Tato možnost nabízí náhled a úpravu rozestavení vašich jednotek na začátku mise. Pohyb není omezen. Stiskněte a podržte 'Alt' pro zvýraznění platných pozic jednotek. Klikněte na ikonu 'Zrušit misi' pro uložení upraveného rozmístění. Klikněte na ikonu 'Konec kola' pro opuštění náhledu.{NEWLINE}Mějte na paměti, že přidáním nových vojáků nebo vozidel do stroje se automaticky zneplatní uložené vlastní rozmístění. Je-li nějaké vlastní rozmístění nastaveno, u tlačítka 'Náhled' je zobrazena hvězdička."
  STR_CRAFT_DEPLOYMENT_PREVIEW_BRIEFING_DUMMY: "Tato možnost nabízí náhled a úpravu tabulky rozmístění pro tento typ stroje. Veškeré změny se použijí na všechny vaše současné stroje i na stroje zakoupené nebo vyrobené později během kampaně. Začínáte s maximálním počtem vojáků. Každý voják představuje jeden řádek v tabulce rozmístění. Jméno vojáka odpovídá číslu řádku. Chcete-li vytvořit místo pro jednotku 2×2, umístěte čtyři vojáky do čtverce 2×2. Pokud takové místo nevytvoříte, jednotka 2×2 bude ve skutečné bitvě chybět."
  STR_BASE_DEFENSE_BRIEFING_PREVIEW: "Tato možnost nabízí náhled na vaši základnu.{NEWLINE}Hodně zábavy!{NEWLINE}{NEWLINE}Klikněte na ikonu 'Konec kola' pro ukončení náhledu."
  STR_NOT_ENOUGH_CARGO_SPACE: "NEDOSTATEČNÁ PŘEPRAVNÍ KAPACITA!{SMALLLINE}Zvolte jiný modul nebo snižte počet přidělených členů posádky."
