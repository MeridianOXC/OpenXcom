  STR_CRAFT_DEPLOYMENT_PREVIEW_SAVED: "Náhľad *"
  STR_CRAFT_DEPLOYMENT_PREVIEW_BRIEFING: "Táto funkcia vám umožňuje zobraziť náhľad a prispôsobiť rozmiestnenie vašich jednotiek na začiatku bitky. Máte neobmedzený pohyb. Podržaním klávesu 'Alt' zvýrazníte platné pozície jednotiek. Kliknutím na ikonu 'Ukončiť misiu' uložíte vlastné rozmiestnenie. Kliknutím na ikonu 'Ukončiť kolo' náhľad opustíte.{NEWLINE}Vezmite na vedomie, že pridanie akýchkoľvek nových vojakov alebo vozidiel do plavidla automaticky zruší platnosť uloženého rozmiestnenia. Prítomnosť uloženého vlastného rozmiestnenia je indikovaná hviezdičkou na tlačidle 'Náhľad'."
  STR_CRAFT_DEPLOYMENT_PREVIEW_BRIEFING_DUMMY: "Táto funkcia vám umožňuje zobraziť náhľad a upraviť tabuľku rozmiestnenia pre tento typ plavidla. Akékoľvek zmeny sa prejavia u všetkých vašich aktuálnych plavidiel a tiež u všetkých plavidiel, ktoré si kúpite alebo vyrobíte neskôr v kampani. Začínate s maximálnym počtom vojakov. Každý vojak predstavuje jeden riadok v tabuľke rozmiestnenia. Mená vojakov zodpovedajú číslam riadkov. Ak chcete vytvoriť miesto pre jednotku 2x2, umiestnite 4 vojakov do štvorca 2x2. Ak toto miesto nebude pripravené, jednotka 2x2 bude v skutočnej bitke chýbať."
  STR_BASE_DEFENSE_BRIEFING_PREVIEW: "Táto funkcia vám umožňuje zobraziť náhľad vašej základne.{NEWLINE}Príjemnú zábavu!{NEWLINE}{NEWLINE}Kliknutím na ikonu 'Ukončiť kolo' náhľad opustíte."
  STR_NOT_ENOUGH_CARGO_SPACE: "NEDOSTATOK NÁKLADNÉHO PRIESTORU!{SMALLLINE}Použite iný modul alebo znížte počet pridelenej posádky."
