  STR_CRAFT_DEPLOYMENT_PREVIEW: "Förhandsvisa"
  STR_CRAFT_DEPLOYMENT_PREVIEW_SAVED: "Förhandsvisa *"
  STR_CRAFT_DEPLOYMENT_PREVIEW_BRIEFING: "Med den här funktionen kan du förhandsvisa och anpassa dina enheters utplacering i början av en strid. Du kan förflytta dig obegränsat. Håll ned ”Alt” för att markera giltiga enhetspositioner. Klicka på ikonen ”Avbryt uppdrag” för att spara en anpassad utplacering. Klicka på ikonen ”Avsluta tur” för att lämna förhandsvisningen.{NEWLINE}Observera att en sparad anpassad utplacering automatiskt ogiltigförklaras om du lägger till nya soldater eller fordon i farkosten. En asterisk på knappen ”Förhandsvisa” visar att det finns en anpassad utplacering."
  STR_CRAFT_DEPLOYMENT_PREVIEW_BRIEFING_DUMMY: "Med den här funktionen kan du förhandsvisa och ändra utplaceringstabellen för den här farkosttypen. Alla ändringar gäller alla dina nuvarande farkoster samt alla farkoster som du köper eller tillverkar senare under kampanjen. Du börjar med det högsta antalet soldater. Varje soldat motsvarar en rad i utplaceringstabellen. Soldatnamnen motsvarar radnumren. För att skapa plats för en 2×2-enhet placerar du fyra soldater i en 2×2-ruta. Om det inte finns plats saknas 2×2-enheten i en riktig strid."
  STR_BASE_DEFENSE_BRIEFING_PREVIEW: "Med den här funktionen kan du förhandsvisa din bas.{NEWLINE}Ha så kul!{NEWLINE}{NEWLINE}Klicka på ikonen ”Avsluta tur” för att lämna förhandsvisningen."
  STR_NOT_ENOUGH_CARGO_SPACE: "INTE TILLRÄCKLIGT MED LASTUTRYMME!{SMALLLINE}Använd en annan modul eller minska den tilldelade besättningen."
